<!DOCTYPE html>
<html lang="en">
 <head>
  <title>
   Prescription ordering
  </title>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <style>
    h1 {
        font-size: 48px;
    }
  </style>

 </head>
 <body>
  <main>
   <h1>
     Order your perscription here
   </h1>
   <form>
    <label for="fname">
     <h1>
      First name:
     </h1>
    </label>
    <input id="fname" type="text"/>
    <br/>
    <br/>
    <label for="sname">
     <h1>
       Last name:
     </h1>
    </label>
    <input id="sname" type="text"/>
    <br/>
    <br/>
    <label for="medication">
     <h1>
       What medication do you need:
     </h1>
    </label>
    <input id="medication" type="text"/>
    <br/>
    <br/>
    <label for="number">
     <h1>
       How many do you need:
     </h1>
    </label>
    <input id="number" name="number" type="text"/>
    <br/>
    <br/>
    <input id="submit-btn" type="submit"/>
    <br/>
   </form>
   <h2 id="result">
   </h2>
  </main>
  <script src="bad_website.js" type="module">
  </script>
 </body>
</html>
