<!DOCTYPE html>
<html lang="en">

<head>
    <title>Prescription Ordering - Accessible Form</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <main>
        <!-- Use h1 for the primary title of the page -->
        <h1>Order your prescription here</h1>

        <form action="/submit-prescription" method="POST">

            <!-- First Name -->
            <div>
                <label for="first-name">First name:</label><br>
                <input type="text" id="first-name" name="first_name" required autocomplete="given-name">
            </div>
            <br>

            <!-- Last Name -->
            <div>
                <label for="last-name">Last name:</label><br>
                <input type="text" id="last-name" name="last_name" required autocomplete="family-name">
            </div>
            <br>

            <!-- Medication -->
            <div>
                <label for="medication">What medication do you need?</label><br>
                <input type="text" id="medication" name="medication" required>
            </div>
            <br>

            <!-- Quantity Dropdown -->
            <div>
                <label for="quantity">How many do you need?</label><br>
                <select id="quantity" name="quantity" required>
                    <option value="" disabled selected>Select quantity</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>
            <br>

            <!-- Submit Button -->
            <div>
                <button type="submit">Submit Order</button>
            </div>

        </form>
    </main>
</body>

</html>
