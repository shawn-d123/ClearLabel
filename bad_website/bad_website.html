
<!DOCTYPE html>
<html lang="en">

<head>
<title>Prescription ordering</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<main>
    <h2><b>Order your perscription here</b></h2>

    <form>
        <div>First name</div>
        <input type="text" id="fname"><br><br>

        <div>Last name</div>
        <input type="text" id="sname"><br><br>

        <div>What medication do you need</div>
        <input type="text" id="medication"><br><br>

        <div>How many do you need</div>
        <select id="number">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
        </select>

        <br><br>

        <input type="submit" id="submit-btn"><br>
    </form>

    <h2 id="result"></h2>

</main>

<script type="module" src="bad_website.js"></script>

</body>

</html>
