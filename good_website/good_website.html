<!DOCTYPE html>
<html lang="en">

<head>
    <title>Prescription Ordering - Accessible Form</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <main>
        <h1><big>Order your prescription here</big></h1>

        <form action="/submit-prescription" method="POST">

            <!-- First Name -->
            <div>
                <label for="first-name"><big>First name:</big></label><br>
                <input type="text" id="first-name" name="first_name" required autocomplete="given-name">
            </div>
            <br>

            <!-- Last Name -->
            <div>
                <label for="last-name"><big>Last name:</big></label><br>
                <input type="text" id="last-name" name="last_name" required autocomplete="family-name">
            </div>
            <br>

            <!-- Medication -->
            <div>
                <label for="medication"><big>What medication do you need?</big></label><br>
                <input type="text" id="medication" name="medication" required>
            </div>
            <br>

            <!-- Quantity Text Input (Replaced Dropdown) -->
            <div>
                <label for="quantity"><big>How many do you need?</big></label><br>
                <input type="text" id="quantity" name="quantity" required>
            </div>
            <br>

            <!-- Submit Button -->
            <div>
                <button type="submit"><big>Submit Order</big></button>
            </div>

        </form>
    </main>
</body>

</html>
