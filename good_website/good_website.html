<!DOCTYPE html>
<html lang="en">
 <head>
  <title>
   Prescription ordering
  </title>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
 </head>
 <body>
  <main>
   <h1>
    <big>
     Order your perscription here
    </big>
   </h1>
   <form>
    <label for="fname">
     <big>
      First name:
     </big>
    </label>
    <input id="fname" type="text"/>
    <br/>
    <br/>
    <label for="sname">
     <big>
      Last name:
     </big>
    </label>
    <input id="sname" type="text"/>
    <br/>
    <br/>
    <label for="medication">
     <big>
      What medication do you need:
     </big>
    </label>
    <input id="medication" type="text"/>
    <br/>
    <br/>
    <label for="number">
     <big>
      How many do you need:
     </big>
    </label>
    <input id="number" name="number" type="text"/>
    <br/>
    <br/>
    <input type="submit"/>
    <br/>
   </form>
  </main>
  <script src="bad_website.js" type="module">
  </script>
 </body>
</html>
