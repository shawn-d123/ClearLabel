
<!DOCTYPE html>
<html lang="en">

<head>
<title>Prescription ordering</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>


<main>
    <h2><b>Order your perscription here</b></h2>

    <form>
        <div>First name</div>
        <input type="text"><br><br>

        <div>Last name</div>
        <input type="text"><br><br>

        <div>What medication do you need</div>
        <input type="text"><br><br>

        <div>How many do you need</div>
        <select>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
        </select>

        <br><br>

        <input type="submit"><br>
    </form>


</main>

</html>
